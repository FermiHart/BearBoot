[package]
name = "bbp-wire"
version = "1.4.0"
edition = "2021"
rust-version = "1.77"
license = "BSD-3-Clause"
publish = false
description = "Dependency-free no_std BBP v1.1 and experimental v2 wire framing"
repository = "https://github.com/FermiHart/BearBoot"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "examples/auth_envelope.rs",
    "examples/v2_profile.rs",
    "src/auth.rs",
    "src/crc.rs",
    "src/lib.rs",
    "src/refs.rs",
    "src/v2.rs",
    "src/wire.rs",
    "tests/conformance.rs",
    "tests/v2_conformance.rs",
    "tests/vectors/bbp-v2-profile0-auth-v1.json",
]

[lib]
path = "src/lib.rs"

[dependencies]
