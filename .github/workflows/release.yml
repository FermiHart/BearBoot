# SPDX-License-Identifier: BSD-3-Clause

name: release

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed sdk-vMAJOR.MINOR.PATCH tag to resume
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate and reproduce release assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag_commit: ${{ steps.provenance.outputs.tag_commit }}
      tag_object: ${{ steps.provenance.outputs.tag_object }}
    steps:
      - name: Validate release tag shape
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^sdk-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be sdk-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag identity and provenance
        id: provenance
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          if [[ -n "$EVENT_SHA" ]]; then
            event_commit="$(git rev-parse "$EVENT_SHA^{commit}")"
            test "$event_commit" = "$tag_commit"
          fi
          git merge-base --is-ancestor "$tag_commit" "refs/remotes/origin/$DEFAULT_BRANCH"
          git -c gpg.ssh.allowedSignersFile=.github/release-signers \
            -c gpg.minTrustLevel=fully \
            verify-tag "refs/tags/$RELEASE_TAG"

          if [[ "$(gh api "repos/$GH_REPO/git/tags/$tag_object" \
            --jq '.verification.verified')" != true ]]; then
            reason="$(gh api "repos/$GH_REPO/git/tags/$tag_object" \
              --jq '.verification.reason')"
            echo "GitHub did not verify the annotated tag signature: $reason" >&2
            exit 1
          fi
          printf 'tag_commit=%s\ntag_object=%s\n' \
            "$tag_commit" "$tag_object" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install C, QEMU, and OVMF gates
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils-aarch64-linux-gnu binutils-riscv64-linux-gnu \
            build-essential clang gcc-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu jq lld openssl ovmf \
            qemu-system-arm qemu-system-misc qemu-system-x86 swtpm

      - name: Install Rust stable and MSRV 1.77
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable clippy rustfmt
          rustup toolchain install 1.77.0 --profile minimal
          rustup default stable
          cargo +stable --version
          cargo +1.77.0 --version

      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#sdk-v}"
          test "$(tr -d '\r\n' < sdk/VERSION)" = "$version"
          crate_version="$(cargo +stable metadata --offline --no-deps \
            --format-version 1 --manifest-path sdk/rust/bbp-wire/Cargo.toml \
            | jq -r '.packages[] | select(.name == "bbp-wire") | .version')"
          test "$crate_version" = "$version"
          grep -Eq '^#define BBP_VERSION_MAJOR[[:space:]]+1([[:space:]]|$)' include/bbp/bbp.h
          grep -Eq '^#define BBP_VERSION_MINOR[[:space:]]+1([[:space:]]|$)' include/bbp/bbp.h

      - name: Run all release gates
        run: |
          set -euo pipefail
          make check
          make v2-portability v2-fuzz auth2-portability auth2-sanitize-test
          make tpm2-measure-test
          make freestanding CROSS=
          make qemu
          make qemu-aarch64
          make qemu-riscv64
          make qemu-uefi
          make qemu-uefi-loader
          make qemu-uefi-tcg2
          make ports-check CROSS=
          make ports-hosted-check

      - name: Build and compare release assets twice
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          version="${RELEASE_TAG#sdk-v}"
          epoch="$(git show -s --format=%ct HEAD)"
          first="$RUNNER_TEMP/release-first"
          second="$RUNNER_TEMP/release-second"
          release_dir="$GITHUB_WORKSPACE/build/release"
          rm -rf "$first" "$second" "$release_dir"
          mkdir -p "$first/sdk" "$second/sdk" "$release_dir"
          export SOURCE_DATE_EPOCH="$epoch"

          python3 tools/package_sdk.py --release --output-dir "$first/sdk"
          python3 tools/package_sdk.py --release --output-dir "$second/sdk"
          for name in \
            "bearboot-c-sdk-$version.tar.gz" \
            "bearboot-host-tools-$version.tar.gz"; do
            cmp --silent "$first/sdk/$name" "$second/sdk/$name"
            install -m 0644 "$first/sdk/$name" "$release_dir/$name"
          done

          CARGO_TARGET_DIR="$first/cargo" cargo +stable package --frozen \
            --manifest-path sdk/rust/bbp-wire/Cargo.toml
          CARGO_TARGET_DIR="$second/cargo" cargo +stable package --frozen \
            --manifest-path sdk/rust/bbp-wire/Cargo.toml
          crate="bbp-wire-$version.crate"
          cmp --silent "$first/cargo/package/$crate" "$second/cargo/package/$crate"
          install -m 0644 "$first/cargo/package/$crate" "$release_dir/$crate"

          python3 tools/generate_release_metadata.py \
            --source-revision "$(git rev-parse HEAD)" \
            --output-dir "$release_dir" \
            --artifact "$release_dir/bearboot-c-sdk-$version.tar.gz" \
            --artifact "$release_dir/bearboot-host-tools-$version.tar.gz" \
            --artifact "$release_dir/$crate"
          test -s "$release_dir/SUPPORT-MATRIX.json"
          test -s "$release_dir/bearboot-sdk-$version.spdx.json"
          jq -e --arg version "$version" \
            '.package_version == $version and .wire_version == "1.1" and
             .title == ("BearBoot SDK " + $version + " (BBP wire 1.1)")' \
            "$release_dir/SUPPORT-MATRIX.json" >/dev/null
          jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array")' \
            "$release_dir/bearboot-sdk-$version.spdx.json" >/dev/null

          (
            cd "$release_dir"
            sha256sum \
              "bearboot-c-sdk-$version.tar.gz" \
              "bearboot-host-tools-$version.tar.gz" \
              "$crate" \
              SUPPORT-MATRIX.json \
              "bearboot-sdk-$version.spdx.json" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Upload validated release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input-${{ github.sha }}
          path: build/release/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

  sign:
    name: sign release assets
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download validated release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.sha }}
          path: release

      - name: Revalidate transferred assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "release/bearboot-c-sdk-$VERSION.tar.gz"
            "release/bearboot-host-tools-$VERSION.tar.gz"
            "release/bbp-wire-$VERSION.crate"
             "release/SUPPORT-MATRIX.json"
            "release/bearboot-sdk-$VERSION.spdx.json"
            "release/SHA256SUMS"
          )
          shopt -s nullglob
          actual=(release/*)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do test -f "$file"; done
          (cd release && sha256sum --check SHA256SUMS)

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Keyless-sign and attest release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          sbom="release/bearboot-sdk-$VERSION.spdx.json"
          payloads=(
            "release/bearboot-c-sdk-$VERSION.tar.gz"
            "release/bearboot-host-tools-$VERSION.tar.gz"
            "release/bbp-wire-$VERSION.crate"
             "release/SUPPORT-MATRIX.json"
            "$sbom"
            "release/SHA256SUMS"
          )

          for file in "${payloads[@]}"; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob \
              --bundle "$file.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$file"
          done
          for file in "${payloads[@]:0:3}"; do
            cosign attest-blob --yes --type spdxjson --predicate "$sbom" \
              --bundle "$file.sbom.sigstore.json" "$file"
            cosign verify-blob-attestation --type spdxjson \
              --bundle "$file.sbom.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$file"
          done

      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.release_tag || github.ref_name }}
          path: release/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

  publish:
    name: publish GitHub release
    needs: [validate, sign]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.release_tag || github.ref_name }}
          path: release

      - name: Validate signed release bundle
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "release/bearboot-c-sdk-$VERSION.tar.gz"
            "release/bearboot-host-tools-$VERSION.tar.gz"
            "release/bbp-wire-$VERSION.crate"
            "release/SUPPORT-MATRIX.json"
            "release/bearboot-sdk-$VERSION.spdx.json"
            "release/SHA256SUMS"
            "release/bearboot-c-sdk-$VERSION.tar.gz.sigstore.json"
            "release/bearboot-host-tools-$VERSION.tar.gz.sigstore.json"
            "release/bbp-wire-$VERSION.crate.sigstore.json"
            "release/SUPPORT-MATRIX.json.sigstore.json"
            "release/bearboot-sdk-$VERSION.spdx.json.sigstore.json"
            "release/SHA256SUMS.sigstore.json"
            "release/bearboot-c-sdk-$VERSION.tar.gz.sbom.sigstore.json"
            "release/bearboot-host-tools-$VERSION.tar.gz.sbom.sigstore.json"
            "release/bbp-wire-$VERSION.crate.sbom.sigstore.json"
          )
          shopt -s nullglob
          actual=(release/*)
          test "${#actual[@]}" -eq "${#assets[@]}"
          for file in "${assets[@]}"; do test -f "$file"; done
          (cd release && sha256sum --check SHA256SUMS)

      - name: Install Cosign for publication checks
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Reverify Sigstore bundles
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          payloads=(
            "release/bearboot-c-sdk-$VERSION.tar.gz"
            "release/bearboot-host-tools-$VERSION.tar.gz"
            "release/bbp-wire-$VERSION.crate"
            "release/SUPPORT-MATRIX.json"
            "release/bearboot-sdk-$VERSION.spdx.json"
            "release/SHA256SUMS"
          )
          for file in "${payloads[@]}"; do
            cosign verify-blob \
              --bundle "$file.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$file"
          done
          for file in "${payloads[@]:0:3}"; do
            cosign verify-blob-attestation --type spdxjson \
              --bundle "$file.sbom.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$file"
          done

      - name: Create or resume owned draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TAG_COMMIT: ${{ needs.validate.outputs.tag_commit }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          assert_remote_tag() {
            ref="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
            test "$(jq -r '.object.type' <<<"$ref")" = tag
            test "$(jq -r '.object.sha' <<<"$ref")" = "$TAG_OBJECT"
            test "$(gh api "repos/$GH_REPO/git/tags/$TAG_OBJECT" \
              --jq '.object.sha')" = "$TAG_COMMIT"
          }
          assert_remote_tag
          owner="<!-- bearboot-release-owner:v1 tag=$RELEASE_TAG sha=$TAG_COMMIT "
          marker="${owner}run_id=$GITHUB_RUN_ID -->"
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n\n%s\n\n%s\n%s\n' \
            "$marker" \
            "Reproducible C SDK, host tools, and no_std Rust crate for BBP wire 1.1." \
            "Verify SHA256SUMS and the accompanying Sigstore bundles before use." \
            "The crate is not automatically published to crates.io." > "$notes"

          load_matches() {
            release_stream="$(gh api --paginate \
              "repos/$GH_REPO/releases?per_page=100" --jq '.[]')"
            matches="$(jq -s -c --arg tag "$RELEASE_TAG" \
              '[.[] | select(.tag_name == $tag)]' <<<"$release_stream")"
            count="$(jq 'length' <<<"$matches")"
          }
          load_matches
          if [[ "$count" -eq 0 ]]; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "BearBoot SDK $VERSION (BBP wire 1.1)" \
              --notes-file "$notes"
            for attempt in {1..10}; do
              load_matches
              [[ "$count" -ne 0 ]] && break
              sleep 1
            done
          fi
          if [[ "$count" -ne 1 ]]; then
            echo "refusing release tag with an ambiguous GitHub release" >&2
            exit 1
          fi
          assert_remote_tag
          release="$(jq -c '.[0]' <<<"$matches")"
          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg owner "$owner" \
            '.draft == true and .published_at == null and
             .tag_name == $tag and
             ((.body // "") | startswith($owner))' \
            <<<"$release" >/dev/null; then
            echo "refusing to replace a published or unrelated release" >&2
            exit 1
          fi
          printf 'release_id=%s\n' "$(jq -r '.id' <<<"$release")" >> "$GITHUB_OUTPUT"

      - name: Upload exact assets to owned draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TAG_COMMIT: ${{ needs.validate.outputs.tag_commit }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          owner="<!-- bearboot-release-owner:v1 tag=$RELEASE_TAG sha=$TAG_COMMIT "
          assets=(
            "release/bearboot-c-sdk-$VERSION.tar.gz"
            "release/bearboot-host-tools-$VERSION.tar.gz"
            "release/bbp-wire-$VERSION.crate"
            "release/SUPPORT-MATRIX.json"
            "release/bearboot-sdk-$VERSION.spdx.json"
            "release/SHA256SUMS"
            "release/bearboot-c-sdk-$VERSION.tar.gz.sigstore.json"
            "release/bearboot-host-tools-$VERSION.tar.gz.sigstore.json"
            "release/bbp-wire-$VERSION.crate.sigstore.json"
            "release/SUPPORT-MATRIX.json.sigstore.json"
            "release/bearboot-sdk-$VERSION.spdx.json.sigstore.json"
            "release/SHA256SUMS.sigstore.json"
            "release/bearboot-c-sdk-$VERSION.tar.gz.sbom.sigstore.json"
            "release/bearboot-host-tools-$VERSION.tar.gz.sbom.sigstore.json"
            "release/bbp-wire-$VERSION.crate.sbom.sigstore.json"
          )

          assert_owned_draft() {
            gh api "repos/$GH_REPO/releases/$RELEASE_ID" | jq -e \
              --argjson id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" \
              --arg owner "$owner" \
              '.id == $id and .draft == true and .published_at == null and
               .tag_name == $tag and
               ((.body // "") | startswith($owner))' >/dev/null
          }
          assert_owned_draft

          expected_names="$RUNNER_TEMP/expected-release-assets"
          remote_names="$RUNNER_TEMP/existing-release-assets"
          for file in "${assets[@]}"; do basename "$file"; done | sort > "$expected_names"
          gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[].name' | sort > "$remote_names"
          if [[ -n "$(comm -23 "$remote_names" "$expected_names")" ]]; then
            echo "refusing to clobber a draft containing an unexpected asset" >&2
            exit 1
          fi

          remote_stream="$(gh api --paginate \
            "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" --jq '.[]')"
          remote="$(jq -s -c '.' <<<"$remote_stream")"
          for file in "${assets[@]}"; do
            name="$(basename "$file")"
            while read -r asset_id; do
              [[ -z "$asset_id" ]] || gh api --method DELETE \
                "repos/$GH_REPO/releases/assets/$asset_id" --silent
            done < <(jq -r --arg name "$name" \
              '.[] | select(.name == $name) | .id' <<<"$remote")
            assert_owned_draft
            gh api --method POST \
              "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$name" \
              --header "Content-Type: application/octet-stream" \
              --input "$file" --silent
          done
          assert_owned_draft

      - name: Verify remote assets and publish owned draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TAG_COMMIT: ${{ needs.validate.outputs.tag_commit }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "release/bearboot-c-sdk-$VERSION.tar.gz"
            "release/bearboot-host-tools-$VERSION.tar.gz"
            "release/bbp-wire-$VERSION.crate"
            "release/SUPPORT-MATRIX.json"
            "release/bearboot-sdk-$VERSION.spdx.json"
            "release/SHA256SUMS"
            "release/bearboot-c-sdk-$VERSION.tar.gz.sigstore.json"
            "release/bearboot-host-tools-$VERSION.tar.gz.sigstore.json"
            "release/bbp-wire-$VERSION.crate.sigstore.json"
            "release/SUPPORT-MATRIX.json.sigstore.json"
            "release/bearboot-sdk-$VERSION.spdx.json.sigstore.json"
            "release/SHA256SUMS.sigstore.json"
            "release/bearboot-c-sdk-$VERSION.tar.gz.sbom.sigstore.json"
            "release/bearboot-host-tools-$VERSION.tar.gz.sbom.sigstore.json"
            "release/bbp-wire-$VERSION.crate.sbom.sigstore.json"
          )
          assert_remote_tag() {
            ref="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
            test "$(jq -r '.object.type' <<<"$ref")" = tag
            test "$(jq -r '.object.sha' <<<"$ref")" = "$TAG_OBJECT"
            test "$(gh api "repos/$GH_REPO/git/tags/$TAG_OBJECT" \
              --jq '.object.sha')" = "$TAG_COMMIT"
          }
          assert_remote_assets() {
            remote_stream="$(gh api --paginate \
              "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" --jq '.[]')"
            remote="$(jq -s -c '.' <<<"$remote_stream")"
            test "$(jq 'length' <<<"$remote")" -eq "${#assets[@]}"
            for file in "${assets[@]}"; do
              name="$(basename "$file")"
              size="$(stat -c '%s' "$file")"
              digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
              jq -e \
                --arg name "$name" \
                --argjson size "$size" \
                --arg digest "$digest" \
                '[.[] | select(.name == $name and .size == $size and
                  .digest == $digest)] | length == 1' \
                <<<"$remote" >/dev/null
            done
          }
          assert_remote_tag
          assert_remote_assets

          # Keep reconciliation and publication in one step so no workflow
          # boundary exists between the final digest check and promotion.
          owner="<!-- bearboot-release-owner:v1 tag=$RELEASE_TAG sha=$TAG_COMMIT "
          release="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
          jq -e \
            --argjson id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg owner "$owner" \
            '.id == $id and .draft == true and .published_at == null and
             .tag_name == $tag and
             ((.body // "") | startswith($owner))' \
            <<<"$release" >/dev/null
          assert_remote_tag
          assert_remote_assets
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false --silent
          assert_remote_tag
          assert_remote_assets
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq \
            'select(.draft == false and .published_at != null)' >/dev/null
