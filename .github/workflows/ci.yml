# SPDX-License-Identifier: BSD-3-Clause
#
# CI for the Bear Boot Protocol.
#
# Runs the same gates a contributor must keep green (see CONTRIBUTING.md):
#   - the core: ABI _Static_asserts + host self-test (adversarial) + fuzzer
#   - every port: freestanding scaffold-check (links vs the frozen core) and,
#     where present, the hosted adapter test.
#
# Hosted and port gates use distro compilers. Machine proofs additionally use
# distro cross toolchains for their target ISA.

name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (v1.1 + v2 draft + importers + fuzz + multi-arch qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential clang lld openssl gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu ovmf qemu-system-arm qemu-system-misc qemu-system-x86 swtpm
      - name: Install Rust SDK gates
        run: |
          rustup component add rustfmt clippy
          rustup toolchain install 1.77.0 --profile minimal
      - name: make check (core + importers + SDK + fuzz + docs)
        run: make check
      - name: v2 Draft freestanding portability
        run: make v2-portability v2-fuzz auth2-portability auth2-sanitize-test
      - name: TPM2 canonical measurement proof
        run: make tpm2-measure-test
      - name: bare-metal QEMU proof (TCG)
        run: make qemu
      - name: AArch64 X0 and Device Tree proof (TCG)
        run: make qemu-aarch64
      - name: RISC-V A0 and Device Tree proof (TCG)
        run: make qemu-riscv64
      - name: UEFI/OVMF builder-parser proof (TCG)
        run: make qemu-uefi
      - name: Complete UEFI loader proof (ELF, EBS, paging, RDI)
        run: make qemu-uefi-loader
      - name: UEFI TCG2 SECURITY measurement proof
        run: make qemu-uefi-tcg2

  ports:
    name: ports (scaffold-check + hosted test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Validate the four-port inventory
        run: make port-inventory-test
      - name: Compile every port against the frozen core
        run: make ports-check CROSS=
      - name: Run every hosted adapter proof
        run: make ports-hosted-check

  abi-guard:
    name: frozen-core guard (PRs must not touch the ABI)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject changes to the ABI-frozen core
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # The frozen contract. A port PR should never change these; a change
          # here is a deliberate ABI decision, not a routine contribution.
          frozen='^(include/bbp/(bbp\.h|bbp_crc64\.h|bbp_osif\.h)|kernel/bbp_kernel\.c|kernel/bbp_kernel\.h|bootloader/bbp_build\.c|bootloader/bbp_build\.h)'
          changed="$(git diff --name-only "$base" "$head")"
          hits="$(echo "$changed" | grep -E "$frozen" || true)"
          if [ -n "$hits" ]; then
            echo "::error title=Frozen core touched::This PR modifies the ABI-frozen core:"
            echo "$hits" | sed 's/^/  /'
            echo "The BBP v1.1 contract is frozen. Use a separately approved ABI process for any change."
            exit 1
          else
            echo "OK: PR does not touch the ABI-frozen core."
          fi
